<!doctype html>
<html>
<head>
	<meta charset="utf-8" />
	<title>Notes</title>
	<style>
		body {
			font-family: system-ui, sans-serif;
			background: #f5f5f5;
			color: #222;
		}
		.card {
			background: #fff;
			border: 1px solid #ddd;
			border-radius: 8px;
			padding: 12px 16px;
			margin: 8px 0;
		}
		h1 {
			color: #111;
		}
	</style>
</head>
<body>
	<h1>Notes</h1>
	<div id="notes"></div>
	<script>
		fetch("/notes")
			.then((r) => r.json())
			.then((notes) => {
				document.getElementById("notes").innerHTML = notes
					.map((n) => `<div class="card"><strong>${n.title}</strong><p>${n.body}</p></div>`)
					.join("");
			});
	</script>
</body>
</html>
